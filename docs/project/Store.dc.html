<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cửa hàng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:44px 16px 8px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="Home.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Cửa hàng</div>
    </div>
    <div style="display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 12px 6px 8px;box-shadow:0 3px 0 #D9C3A0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#7C6BD6" stroke="#5B4BB0" stroke-width="1.5"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
      <span style="font-weight:800;font-size:14px">64</span>
    </div>
  </div>

  <!-- tabs -->
  <div style="display:flex;gap:8px;padding:6px 16px 12px">
    <div style="flex:1;text-align:center;padding:9px 0;border-radius:12px;background:{{accent}};color:#fff;font-weight:800;font-size:13px">Trang trí</div>
    <div style="flex:1;text-align:center;padding:9px 0;border-radius:12px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:13px">Đồng phục</div>
    <div style="flex:1;text-align:center;padding:9px 0;border-radius:12px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:13px">Gem</div>
  </div>

  <!-- featured banner -->
  <div style="margin:0 16px 12px;background:#E28B9B;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #C64C63">
    <div>
      <div style="color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:17px">Bộ Trung Thu</div>
      <div style="color:#FFE7EC;font-size:12px;font-weight:700;margin-top:2px">Trang trí giới hạn · giảm 20%</div>
    </div>
    <div style="background:#fff;color:#C64C63;font-weight:800;font-size:13px;padding:8px 16px;border-radius:12px">Xem</div>
  </div>

  <!-- grid of items -->
  <div style="flex-grow:1;overflow:hidden;padding:0 16px">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 0 #EADFC8;text-align:center">
        <div style="height:82px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:8px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-weight:800;font-size:13px">Bàn gỗ cổ điển</div>
        <div style="margin-top:8px;background:{{accent}};color:#fff;font-weight:800;font-size:12px;padding:7px 0;border-radius:10px;box-shadow:0 2px 0 #7A3E12">500 ₵</div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 0 #EADFC8;text-align:center">
        <div style="height:82px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:8px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-weight:800;font-size:13px">Biển hiệu neon</div>
        <div style="margin-top:8px;background:#7C6BD6;color:#fff;font-weight:800;font-size:12px;padding:7px 0;border-radius:10px;box-shadow:0 2px 0 #5B4BB0">90 gem</div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 0 #EADFC8;text-align:center">
        <div style="height:82px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:8px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-weight:800;font-size:13px">Cây cảnh mini</div>
        <div style="margin-top:8px;background:{{accent}};color:#fff;font-weight:800;font-size:12px;padding:7px 0;border-radius:10px;box-shadow:0 2px 0 #7A3E12">320 ₵</div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 0 #EADFC8;text-align:center">
        <div style="height:82px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:8px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-weight:800;font-size:13px">Đèn chùm ấm</div>
        <div style="margin-top:8px;background:#7C6BD6;color:#fff;font-weight:800;font-size:12px;padding:7px 0;border-radius:10px;box-shadow:0 2px 0 #5B4BB0">140 gem</div>
      </div>
    </div>
  </div>

  <!-- earn gem in-game (no real-money payment) -->
  <div style="padding:12px 16px 26px">
    <div style="display:flex;gap:10px">
      <a href="Daily.dc.html" style="flex:1;text-decoration:none;background:#EFE3FB;border:2px solid #C9B6EE;border-radius:16px;padding:12px;text-align:center">
        <div style="font-weight:800;font-size:15px;color:#5B4BB0">Nhiệm vụ ngày</div>
        <div style="margin-top:6px;background:#7C6BD6;color:#fff;font-weight:800;font-size:12px;padding:6px 0;border-radius:10px">Kiếm gem</div>
      </a>
      <a href="Daily.dc.html" style="flex:1;text-decoration:none;background:#EFE3FB;border:2px solid #7C6BD6;border-radius:16px;padding:12px;text-align:center;position:relative">
        <span style="position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#E28B9B;color:#fff;font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px">MIỄN PHÍ</span>
        <div style="font-weight:800;font-size:15px;color:#5B4BB0">Sweet Pass</div>
        <div style="margin-top:6px;background:#7C6BD6;color:#fff;font-weight:800;font-size:12px;padding:6px 0;border-radius:10px">Xem thưởng</div>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
