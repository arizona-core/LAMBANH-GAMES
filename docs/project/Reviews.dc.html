<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đánh giá &amp; trả lời</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button,input{font-family:'Nunito',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:44px 16px 8px;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Đánh giá của khách</div>
  </div>

  <!-- summary -->
  <div style="margin:8px 16px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 0 #EADFC8;display:flex;gap:16px;align-items:center">
    <div style="text-align:center">
      <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:34px;color:#7A3E12;line-height:1">4.8</div>
      <div style="color:#E7B23C;font-size:13px">★★★★★</div>
      <div style="font-size:10px;color:#8A6A54;margin-top:2px">263 đánh giá</div>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;width:8px;color:#8A6A54">5</span><span style="flex-grow:1;height:7px;border-radius:4px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:82%;height:100%;background:#6FA678"></span></span></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;width:8px;color:#8A6A54">4</span><span style="flex-grow:1;height:7px;border-radius:4px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:11%;height:100%;background:#6FA678"></span></span></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;width:8px;color:#8A6A54">3</span><span style="flex-grow:1;height:7px;border-radius:4px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:4%;height:100%;background:#E7B23C"></span></span></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;width:8px;color:#8A6A54">2</span><span style="flex-grow:1;height:7px;border-radius:4px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:2%;height:100%;background:#D98A3D"></span></span></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;width:8px;color:#8A6A54">1</span><span style="flex-grow:1;height:7px;border-radius:4px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:1%;height:100%;background:#C0453F"></span></span></div>
    </div>
  </div>

  <!-- filter -->
  <div style="display:flex;gap:8px;padding:2px 16px 10px">
    <div style="padding:7px 14px;border-radius:999px;background:{{accent}};color:#fff;font-weight:800;font-size:12px">Tất cả</div>
    <div style="padding:7px 14px;border-radius:999px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:12px">Chưa trả lời · 3</div>
    <div style="padding:7px 14px;border-radius:999px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:12px">1–2 ★</div>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px">

    <!-- review with reply already -->
    <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #EADFC8">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:50%;background:#DCE9D5"></div>
        <div style="flex-grow:1"><div style="font-size:13px;font-weight:800">Chị Hoa <span style="font-size:9px;background:#EAF1FA;color:#5B7EA6;border-radius:6px;padding:1px 5px">AI</span></div><div style="color:#E7B23C;font-size:12px">★★★★★</div></div>
        <span style="font-size:10px;color:#A5763F">2 giờ trước</span>
      </div>
      <div style="font-size:13px;color:#4A2B1A;margin-top:8px;line-height:1.5">Bánh kem dâu tươi, giao đúng giờ. Rất hài lòng!</div>
      <div style="margin-top:8px;margin-left:14px;padding:8px 12px;background:#F5EAD6;border-radius:10px;font-size:12px;color:#6B4A32"><b>Bạn:</b> Cảm ơn chị nhiều ạ, hẹn gặp lại! ♥</div>
    </div>

    <!-- negative review, reply box open -->
    <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #EADFC8;border:2px solid #EFC3CD">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:34px;height:34px;border-radius:50%;background:#F6D2DA"></div>
        <div style="flex-grow:1"><div style="font-size:13px;font-weight:800">Anh Tú <span style="font-size:9px;background:#EAF1FA;color:#5B7EA6;border-radius:6px;padding:1px 5px">AI</span></div><div style="color:#E7B23C;font-size:12px">★★<span style="color:#E2CFA8">★★★</span></div></div>
        <span style="font-size:10px;color:#A5763F">Hôm qua</span>
      </div>
      <div style="font-size:13px;color:#4A2B1A;margin-top:8px;line-height:1.5">Bánh hơi khô, chắc để hơi lâu. Mong quán cải thiện.</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" value="" placeholder="Viết lời xin lỗi &amp; đề nghị bù đắp…" style="flex-grow:1;height:40px;border:2px solid #E4CFA8;border-radius:10px;padding:0 12px;font-size:12px;color:#4A2B1A">
        <button style="border:none;background:{{accent}};color:#fff;font-weight:800;font-size:12px;padding:0 14px;border-radius:10px;box-shadow:0 3px 0 #7A3E12;cursor:pointer">Gửi</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return { accent: this.props.accent ?? '#b5651d' }; } }
</script>
</body>
</html>
