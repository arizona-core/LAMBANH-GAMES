<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhiệm vụ hằng ngày</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:44px 16px 8px;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Nhiệm vụ hằng ngày</div>
  </div>

  <!-- check-in -->
  <div style="margin:8px 16px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 0 #EADFC8">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-weight:800;font-size:14px;color:#6B4A32">Điểm danh</span>
      <span style="font-size:12px;font-weight:800;color:#3E7A4A;background:#E3F0DC;border-radius:8px;padding:2px 8px">Chuỗi 4 ngày</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">
      <div style="text-align:center"><div style="border-radius:10px;background:#E3F0DC;padding:8px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E7A4A" stroke-width="3" style="margin:0 auto;display:block"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N1</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:#E3F0DC;padding:8px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E7A4A" stroke-width="3" style="margin:0 auto;display:block"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N2</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:#E3F0DC;padding:8px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E7A4A" stroke-width="3" style="margin:0 auto;display:block"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N3</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:#E3F0DC;padding:8px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E7A4A" stroke-width="3" style="margin:0 auto;display:block"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N4</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:{{accent}};padding:6px 0;box-shadow:0 2px 0 #7A3E12"><div style="font-size:10px;font-weight:800;color:#fff">+30₵</div><div style="font-size:9px;color:#fff">Nhận</div></div><div style="font-size:9px;color:#B5651D;font-weight:800;margin-top:3px">Hôm nay</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:#F1E6D2;padding:8px 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="#7C6BD6" stroke="#5B4BB0" stroke-width="1.5" style="margin:0 auto;display:block"><path d="M6 3h12l4 6-10 12L2 9z"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N6</div></div>
      <div style="text-align:center"><div style="border-radius:10px;background:#F1E6D2;padding:8px 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A5763F" stroke-width="2" style="margin:0 auto;display:block"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><div style="font-size:9px;color:#8A6A54;margin-top:3px">N7</div></div>
    </div>
  </div>

  <!-- quests -->
  <div style="flex-grow:1;overflow:hidden;padding:6px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="font-weight:800;font-size:14px;color:#6B4A32;margin-top:4px">Việc trong ngày</div>

    <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #EADFC8">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:800;font-size:14px">Làm 5 chiếc bánh</span>
        <span style="font-size:12px;font-weight:800;color:#B5651D">+40 ₵</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="flex-grow:1;height:10px;border-radius:5px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:60%;height:100%;background:#6FA678"></span></span>
        <span style="font-size:11px;font-weight:800;color:#8A6A54">3/5</span>
      </div>
    </div>

    <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #EADFC8">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:800;font-size:14px">Bán được 500 ₵</span>
        <span style="display:inline-block;background:{{accent}};color:#fff;font-weight:800;font-size:12px;padding:5px 14px;border-radius:10px;box-shadow:0 2px 0 #7A3E12">Nhận</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="flex-grow:1;height:10px;border-radius:5px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:100%;height:100%;background:#6FA678"></span></span>
        <span style="font-size:11px;font-weight:800;color:#3E7A4A">Xong</span>
      </div>
    </div>

    <div style="background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 #EADFC8">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:800;font-size:14px">Ghé thăm 1 quán khác</span>
        <span style="font-size:12px;font-weight:800;color:#7C6BD6">+2 gem</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="flex-grow:1;height:10px;border-radius:5px;background:#EEE0C6;overflow:hidden"><span style="display:block;width:0%;height:100%;background:#6FA678"></span></span>
        <span style="font-size:11px;font-weight:800;color:#8A6A54">0/1</span>
      </div>
    </div>

    <!-- battle pass teaser -->
    <a href="Store.dc.html" style="margin-top:2px">
      <div style="display:flex;align-items:center;gap:12px;background:#EFE3FB;border:2px solid #C9B6EE;border-radius:16px;padding:12px 14px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#7C6BD6" stroke="#5B4BB0" stroke-width="1.3"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        <div style="flex-grow:1">
          <div style="font-weight:800;font-size:14px;color:#5B4BB0">Sweet Pass Mùa Thu</div>
          <div style="font-size:11px;color:#7A6AAE;font-weight:700">Hoàn thành để mở phần thưởng lớn →</div>
        </div>
      </div>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
