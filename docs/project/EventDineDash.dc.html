<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sự kiện: Khách quịt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:'Nunito',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EAD9BE;font-family:'Nunito',sans-serif;color:#4A2B1A;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="position:absolute;inset:0;background:#3A2412;opacity:.55"></div>

  <div style="position:relative;width:100%;background:#fff;border-radius:26px;box-shadow:0 12px 0 rgba(0,0,0,.18);padding:26px 22px;text-align:center">
    <div style="width:88px;height:88px;border-radius:50%;background:#F3E1C6;margin:0 auto 16px;display:flex;align-items:center;justify-content:center">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#B5651D" stroke-width="2.2"><path d="M13 5l-2 4 3 2-4 8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="4" r="1.6" fill="#B5651D" stroke="none"/><path d="M3 20h6" stroke-linecap="round"/></svg>
    </div>
    <div style="font-size:11px;font-weight:800;color:#B5651D;letter-spacing:1px">RẮC RỐI</div>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;color:#7A3E12;margin-top:4px">Khách quịt tiền!</div>
    <p style="font-size:14px;color:#6B4A32;line-height:1.55;margin:12px 6px 16px">Một khách rời đi mà chưa thanh toán. Lắp camera an ninh để giảm rủi ro bị quịt.</p>

    <div style="display:flex;align-items:center;gap:12px;background:#F3E1C6;border-radius:14px;padding:12px 14px;margin-bottom:20px;text-align:left">
      <div style="width:44px;height:44px;border-radius:10px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
      <div style="flex-grow:1"><div style="font-weight:800;font-size:14px">Mất 1 Tiramisu</div><div style="font-size:11px;color:#8A6A54">Không thu được tiền bán</div></div>
      <div style="font-weight:800;color:#C0453F;font-size:16px">− 180 ₵</div>
    </div>

    <div style="display:flex;gap:10px">
      <button style="flex:1;height:50px;border:2px solid #D9C3A0;background:#fff;border-radius:14px;color:#8A6A54;font-weight:800;font-size:14px;cursor:pointer">Bỏ qua</button>
      <a href="Store.dc.html" style="flex:1">
        <div style="height:50px;border-radius:14px;background:{{accent}};box-shadow:0 4px 0 #7A3E12;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">Mua camera</div>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return { accent: this.props.accent ?? '#b5651d' }; } }
</script>
</body>
</html>
