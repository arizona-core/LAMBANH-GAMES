<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Màn hình chờ (Loading)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b5651d}a:hover{color:#8f4d16}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6D9A8;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 32px 44px;position:relative;overflow:hidden">

  <div style="position:absolute;top:60px;left:-40px;width:140px;height:140px;border-radius:50%;background:#F3CE93"></div>
  <div style="position:absolute;bottom:120px;right:-50px;width:170px;height:170px;border-radius:50%;background:#F3CE93"></div>

  <div style="height:24px"></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;z-index:1">
    <!-- Cupcake mascot -->
    <div style="width:150px;height:150px;border-radius:36px;background:#FFFFFF;box-shadow:0 8px 0 #E3B77B;display:flex;align-items:center;justify-content:center">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22 52h52l-8 30a6 6 0 0 1-6 5H36a6 6 0 0 1-6-5z" fill="#D98A3D"/>
        <path d="M30 60h36M34 74h28" stroke="#9C5A1E" stroke-width="3" stroke-linecap="round"/>
        <path d="M48 16c10 0 14 8 14 8s10-2 12 8c8 2 6 14-2 16H24c-9-2-10-14-1-16 1-9 11-9 13-7 2-8 8-9 12-9z" fill="#E28B9B"/>
        <circle cx="48" cy="20" r="6" fill="#C64C63"/>
      </svg>
    </div>
    <div style="text-align:center">
      <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;line-height:1;color:#7A3E12;letter-spacing:.5px">Sweet Shop</div>
      <div style="font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;color:#A25F26;margin-top:8px">Làm bánh &nbsp;•&nbsp; Bán bánh &nbsp;•&nbsp; Đua top</div>
    </div>
  </div>

  <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:1">
    <div style="width:100%;height:16px;border-radius:999px;background:#E7C089;box-shadow:inset 0 2px 4px rgba(120,70,20,.25);overflow:hidden">
      <div style="width:68%;height:100%;border-radius:999px;background:{{accent}}"></div>
    </div>
    <div style="font-weight:700;font-size:13px;color:#8A5A2A">Đang nướng những chiếc bánh đầu tiên…</div>
    <div style="display:flex;justify-content:space-between;width:100%;font-size:12px;color:#A5763F;margin-top:6px">
      <span>v0.1.0</span>
      <span>© 2026 Studio của bạn</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d","options":["#b5651d","#d98a3d","#e28b9b","#6fa678"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#b5651d' };
  }
}
</script>
</body>
</html>
