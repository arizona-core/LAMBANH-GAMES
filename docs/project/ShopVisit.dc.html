<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ghé thăm quán</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <!-- banner -->
  <div style="height:150px;background:#E28B9B;position:relative;display:flex;align-items:flex-end;justify-content:center">
    <a href="Leaderboard.dc.html" aria-label="Quay lại" style="position:absolute;top:44px;left:16px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <button aria-label="Theo dõi" style="position:absolute;top:44px;right:16px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#E28B9B" stroke="#C64C63" stroke-width="1.5"><path d="M12 21s-7-4.3-9.5-8.5C.5 8.5 3 5 6.5 5 9 5 12 8 12 8s3-3 5.5-3C21 5 23.5 8.5 21.5 12.5 19 16.7 12 21 12 21z"/></svg>
    </button>
    <div style="width:78px;height:78px;border-radius:50%;background:#F6D2DA;border:4px solid #fff;margin-bottom:-38px"></div>
  </div>

  <div style="text-align:center;padding:46px 16px 8px">
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Tiệm của Lan</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px">
      <span style="font-size:12px;font-weight:800;color:#7A3E12;background:#F3D9AE;border-radius:6px;padding:1px 7px">Lv.12</span>
      <span style="color:#E7B23C;font-size:14px">★</span>
      <span style="font-weight:800;font-size:14px">4.8</span>
      <span style="font-size:12px;color:#8A6A54">(263 đánh giá)</span>
    </div>
  </div>

  <!-- their display case -->
  <div style="padding:8px 16px">
    <div style="font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:8px">Bánh đang bán</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div style="background:#fff;border-radius:14px;padding:8px;box-shadow:0 3px 0 #EADFC8;text-align:center">
        <div style="height:56px;border-radius:10px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-size:11px;font-weight:800">Tiramisu</div>
        <div style="font-size:11px;color:#B5651D;font-weight:800;margin:3px 0 4px">180 ₵</div>
        <span style="display:block;background:{{accent}};color:#fff;font-size:11px;font-weight:800;padding:4px 0;border-radius:8px">Mua</span>
      </div>
      <div style="background:#fff;border-radius:14px;padding:8px;box-shadow:0 3px 0 #EADFC8;text-align:center">
        <div style="height:56px;border-radius:10px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-size:11px;font-weight:800">Macaron</div>
        <div style="font-size:11px;color:#B5651D;font-weight:800;margin:3px 0 4px">90 ₵</div>
        <span style="display:block;background:{{accent}};color:#fff;font-size:11px;font-weight:800;padding:4px 0;border-radius:8px">Mua</span>
      </div>
      <div style="background:#fff;border-radius:14px;padding:8px;box-shadow:0 3px 0 #EADFC8;text-align:center">
        <div style="height:56px;border-radius:10px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center;margin-bottom:6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg></div>
        <div style="font-size:11px;font-weight:800">Éclair</div>
        <div style="font-size:11px;color:#B5651D;font-weight:800;margin:3px 0 4px">140 ₵</div>
        <span style="display:block;background:{{accent}};color:#fff;font-size:11px;font-weight:800;padding:4px 0;border-radius:8px">Mua</span>
      </div>
    </div>
  </div>

  <!-- write review -->
  <div style="flex-grow:1;overflow:hidden;padding:12px 16px 0">
    <div style="background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 0 #EADFC8">
      <div style="font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:8px">Để lại đánh giá</div>
      <div style="color:#E7B23C;font-size:26px;letter-spacing:4px;margin-bottom:10px" role="img" aria-label="4 trên 5 sao">★★★★<span style="color:#E2CFA8">★</span></div>
      <div style="display:flex;gap:8px">
        <input type="text" value="" placeholder="Bánh ngon lắm, sẽ quay lại!" style="flex-grow:1;height:42px;border:2px solid #E4CFA8;border-radius:12px;padding:0 12px;font-size:13px;font-family:'Nunito',sans-serif;color:#4A2B1A">
        <button style="border:none;background:{{accent}};color:#fff;font-weight:800;font-size:13px;padding:0 16px;border-radius:12px;box-shadow:0 3px 0 #7A3E12;cursor:pointer">Gửi</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <div style="width:32px;height:32px;border-radius:50%;background:#DCE9D5;flex-shrink:0"></div>
      <div>
        <div style="font-size:12px;font-weight:800">Mây Bakehouse <span style="color:#E7B23C">★★★★★</span></div>
        <div style="font-size:12px;color:#8A6A54;margin-top:2px">Tiramisu béo vừa, đóng gói xinh!</div>
      </div>
    </div>
  </div>

  <div style="padding:12px 16px 26px">
    <button style="width:100%;height:50px;border:2px solid #E28B9B;background:#fff;border-radius:16px;color:#C64C63;font-weight:800;font-size:15px;cursor:pointer">Tặng tip cho chủ quán</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
