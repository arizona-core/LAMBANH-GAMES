<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hướng dẫn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#b5651d}a:hover{color:#8f4d16}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EFC98F;font-family:'Nunito',sans-serif;color:#4A2B1A;position:relative;overflow:hidden">

  <!-- dimmed kitchen behind -->
  <div style="position:absolute;inset:0;background:#3A2412;opacity:.55"></div>

  <!-- spotlighted oven -->
  <div style="position:absolute;left:50%;top:300px;transform:translateX(-50%);width:150px;height:150px;border-radius:26px;background:#FBEFDD;box-shadow:0 0 0 6px #FFD98A,0 0 0 14px rgba(255,217,138,.35);display:flex;align-items:center;justify-content:center">
    <svg width="92" height="92" viewBox="0 0 96 96" aria-hidden="true">
      <rect x="18" y="20" width="60" height="60" rx="10" fill="#C9722E"/>
      <rect x="26" y="30" width="44" height="26" rx="6" fill="#6B3A16"/>
      <circle cx="48" cy="43" r="8" fill="#FFB84D"/>
      <rect x="26" y="62" width="44" height="10" rx="5" fill="#E9B979"/>
      <circle cx="32" cy="26" r="2.5" fill="#FBEFDD"/><circle cx="42" cy="26" r="2.5" fill="#FBEFDD"/>
    </svg>
  </div>

  <!-- top bar -->
  <div style="position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 24px">
    <div style="display:flex;gap:6px">
      <span style="width:22px;height:6px;border-radius:3px;background:#FFD98A"></span>
      <span style="width:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.5)"></span>
      <span style="width:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.5)"></span>
      <span style="width:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.5)"></span>
    </div>
    <a href="Home.dc.html" style="color:#fff;font-weight:800;font-size:14px;text-decoration:none">Bỏ qua</a>
  </div>

  <!-- coach tooltip + mascot -->
  <div style="position:absolute;left:24px;right:24px;top:490px;background:#FFFFFF;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.15);padding:20px 20px 18px">
    <div style="display:flex;gap:14px;align-items:flex-start">
      <div style="flex-shrink:0;width:56px;height:56px;border-radius:50%;background:#FFE0C4;border:3px solid #D98A3D;display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 14h24l-2 6H14z" fill="#fff" stroke="#D98A3D" stroke-width="1"/><rect x="16" y="9" width="16" height="7" rx="3.5" fill="#fff"/>
          <circle cx="24" cy="31" r="8" fill="#F6C99B"/><circle cx="21" cy="30" r="1.4" fill="#5A3216"/><circle cx="27" cy="30" r="1.4" fill="#5A3216"/>
        </svg>
      </div>
      <div>
        <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#7A3E12">Bếp trưởng Cам</div>
        <div style="font-size:15px;color:#4A2B1A;line-height:1.5;margin-top:4px">Chạm vào <b>lò nướng</b> để làm chiếc bánh đầu tiên của bạn nhé!</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">
      <span style="font-size:13px;font-weight:800;color:#A5763F">Bước 1 / 4</span>
      <a href="Baking.dc.html" style="text-decoration:none">
        <div style="height:44px;padding:0 26px;border-radius:14px;background:{{accent}};box-shadow:0 3px 0 #7A3E12;display:flex;align-items:center;color:#fff;font-weight:800;font-size:15px">Tiếp tục</div>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
