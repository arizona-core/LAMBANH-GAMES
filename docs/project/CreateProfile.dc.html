<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tạo tiệm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
input{font-family:'Nunito',sans-serif}
a{color:#b5651d}a:hover{color:#8f4d16}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;padding:40px 28px 28px;overflow:hidden">

  <div style="text-align:center;margin-bottom:20px">
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:#7A3E12">Mở tiệm của bạn</div>
    <div style="font-size:13px;color:#8A6A54;margin-top:4px">Đặt tên và trang trí để bắt đầu</div>
  </div>

  <!-- Avatar preview + picker -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px">
    <div style="width:88px;height:88px;border-radius:50%;background:#FFE0C4;border:4px solid #D98A3D;display:flex;align-items:center;justify-content:center">
      <svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M12 14h24l-2 6H14z" fill="#FFFFFF"/><rect x="16" y="9" width="16" height="7" rx="3.5" fill="#FFFFFF"/>
        <circle cx="24" cy="30" r="9" fill="#F6C99B"/><circle cx="21" cy="29" r="1.5" fill="#5A3216"/><circle cx="27" cy="29" r="1.5" fill="#5A3216"/>
        <path d="M21 33c2 1.5 4 1.5 6 0" stroke="#5A3216" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="display:flex;gap:10px" role="group" aria-label="Chọn ảnh đại diện">
      <button aria-label="Avatar 1" style="width:44px;height:44px;border-radius:50%;background:#FFE0C4;border:3px solid #D98A3D;cursor:pointer"></button>
      <button aria-label="Avatar 2" style="width:44px;height:44px;border-radius:50%;background:#D9EAD3;border:3px solid transparent;cursor:pointer"></button>
      <button aria-label="Avatar 3" style="width:44px;height:44px;border-radius:50%;background:#F6D2DA;border:3px solid transparent;cursor:pointer"></button>
      <button aria-label="Avatar 4" style="width:44px;height:44px;border-radius:50%;background:#D6E4F5;border:3px solid transparent;cursor:pointer"></button>
    </div>
  </div>

  <!-- Fields -->
  <div style="display:flex;flex-direction:column;gap:16px;flex-grow:1">
    <div>
      <label for="owner" style="display:block;font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:6px">Tên chủ quán</label>
      <input id="owner" type="text" value="Minh Anh" style="width:100%;box-sizing:border-box;height:50px;border:2px solid #E4CFA8;border-radius:14px;background:#fff;padding:0 16px;font-size:16px;font-weight:700;color:#4A2B1A">
    </div>
    <div>
      <label for="shop" style="display:block;font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:6px">Tên quán</label>
      <input id="shop" type="text" value="Tiệm Bánh Nắng" style="width:100%;box-sizing:border-box;height:50px;border:2px solid #6FA678;border-radius:14px;background:#fff;padding:0 16px;font-size:16px;font-weight:700;color:#4A2B1A">
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
        <span style="display:inline-flex;align-items:center;gap:4px;background:#E3F0DC;color:#3E7A4A;font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3E7A4A" stroke-width="3"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tên còn trống
        </span>
        <span style="font-size:12px;color:#A5763F">sweetshop.game/tiem-banh-nang</span>
      </div>
    </div>
    <div>
      <span style="display:block;font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:8px">Màu chủ đạo của quán</span>
      <div style="display:flex;gap:12px" role="group" aria-label="Chọn màu quán">
        <button aria-label="Caramel" style="width:40px;height:40px;border-radius:12px;background:#D98A3D;border:3px solid #7A3E12;cursor:pointer"></button>
        <button aria-label="Hồng dâu" style="width:40px;height:40px;border-radius:12px;background:#E28B9B;border:3px solid transparent;cursor:pointer"></button>
        <button aria-label="Xanh bạc hà" style="width:40px;height:40px;border-radius:12px;background:#6FA678;border:3px solid transparent;cursor:pointer"></button>
        <button aria-label="Xanh biển" style="width:40px;height:40px;border-radius:12px;background:#5B8DBE;border:3px solid transparent;cursor:pointer"></button>
        <button aria-label="Tím" style="width:40px;height:40px;border-radius:12px;background:#9B7BD6;border:3px solid transparent;cursor:pointer"></button>
        <button aria-label="Vàng" style="width:40px;height:40px;border-radius:12px;background:#E7B23C;border:3px solid transparent;cursor:pointer"></button>
      </div>
    </div>
  </div>

  <a href="Tutorial.dc.html" style="text-decoration:none">
    <div style="height:56px;border-radius:16px;background:{{accent}};box-shadow:0 4px 0 #7A3E12;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;font-family:'Fredoka',sans-serif">Mở tiệm ngay</div>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d","options":["#b5651d","#d98a3d","#e28b9b","#6fa678"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
