<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bếp bánh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <!-- header -->
  <div style="padding:44px 16px 10px;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Bếp bánh</div>
  </div>

  <!-- tabs -->
  <div style="display:flex;gap:8px;padding:6px 16px 12px">
    <div style="flex:1;text-align:center;padding:9px 0;border-radius:12px;background:{{accent}};color:#fff;font-weight:800;font-size:14px">Công thức</div>
    <div style="flex:1;text-align:center;padding:9px 0;border-radius:12px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:14px">Kho nguyên liệu</div>
  </div>

  <!-- recipe list -->
  <div style="flex-grow:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px">

    <!-- recipe card -->
    <div style="display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 #EADFC8">
      <div style="width:70px;height:70px;border-radius:14px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
        <span style="font-size:9px;color:#A5763F;font-weight:700">Bánh bông lan</span>
      </div>
      <div style="flex-grow:1;min-width:0">
        <div style="font-weight:800;font-size:15px;color:#4A2B1A">Bánh bông lan</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Bột x2</span>
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Trứng x2</span>
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Đường x1</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
          <span style="font-size:12px;color:#8A6A54;font-weight:700">⏱ 45 giây</span>
          <a href="Baking.dc.html"><span style="display:inline-block;background:{{accent}};color:#fff;font-weight:800;font-size:13px;padding:7px 18px;border-radius:12px;box-shadow:0 3px 0 #7A3E12">Làm</span></a>
        </div>
      </div>
    </div>

    <!-- recipe card 2 -->
    <div style="display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 #EADFC8">
      <div style="width:70px;height:70px;border-radius:14px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
        <span style="font-size:9px;color:#A5763F;font-weight:700">Cupcake</span>
      </div>
      <div style="flex-grow:1;min-width:0">
        <div style="font-weight:800;font-size:15px;color:#4A2B1A">Cupcake dâu</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Bột x2</span>
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Bơ x1</span>
          <span style="font-size:10px;font-weight:700;color:#A5763F;background:#F3E6CE;border-radius:6px;padding:2px 6px">Dâu x2</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
          <span style="font-size:12px;color:#8A6A54;font-weight:700">⏱ 70 giây</span>
          <a href="Baking.dc.html"><span style="display:inline-block;background:{{accent}};color:#fff;font-weight:800;font-size:13px;padding:7px 18px;border-radius:12px;box-shadow:0 3px 0 #7A3E12">Làm</span></a>
        </div>
      </div>
    </div>

    <!-- locked recipe -->
    <div style="display:flex;gap:12px;background:#F1E6D2;border-radius:18px;padding:12px;opacity:.85">
      <div style="width:70px;height:70px;border-radius:14px;background:#E7D8BC;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A5763F" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center">
        <div style="font-weight:800;font-size:15px;color:#8A6A54">Bánh kem sinh nhật</div>
        <div style="font-size:12px;color:#A5763F;margin-top:4px;font-weight:700">Mở khoá ở Cấp 10</div>
      </div>
    </div>
  </div>

  <!-- inventory strip: Vecteezy ingredient placeholders -->
  <div style="margin:12px 16px 24px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 #EADFC8">
    <div style="font-weight:800;font-size:12px;color:#6B4A32;margin-bottom:10px">Kho nguyên liệu &nbsp;<span style="font-weight:600;color:#A5763F">(thả ảnh Vecteezy vào các ô)</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
      <div style="text-align:center">
        <div style="height:54px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;position:relative;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="position:absolute;top:-6px;right:-6px;background:#6FA678;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px">12</span>
        </div>
        <div style="font-size:10px;font-weight:700;color:#8A6A54;margin-top:4px">Bột mì</div>
      </div>
      <div style="text-align:center">
        <div style="height:54px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;position:relative;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="position:absolute;top:-6px;right:-6px;background:#6FA678;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px">8</span>
        </div>
        <div style="font-size:10px;font-weight:700;color:#8A6A54;margin-top:4px">Trứng</div>
      </div>
      <div style="text-align:center">
        <div style="height:54px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;position:relative;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="position:absolute;top:-6px;right:-6px;background:#6FA678;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px">5</span>
        </div>
        <div style="font-size:10px;font-weight:700;color:#8A6A54;margin-top:4px">Bơ</div>
      </div>
      <div style="text-align:center">
        <div style="height:54px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;position:relative;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="position:absolute;top:-6px;right:-6px;background:#E28B9B;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px">2</span>
        </div>
        <div style="font-size:10px;font-weight:700;color:#8A6A54;margin-top:4px">Dâu tây</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
