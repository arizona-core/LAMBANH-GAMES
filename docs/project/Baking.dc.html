<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Làm bánh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4D9AB;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <!-- header -->
  <div style="padding:44px 16px 8px;display:flex;align-items:center;justify-content:space-between">
    <a href="Kitchen.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E0C79B;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="text-align:center">
      <div style="font-size:11px;font-weight:700;color:#A25F26">Đang làm</div>
      <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:#7A3E12">Bánh bông lan</div>
    </div>
    <div style="width:40px"></div>
  </div>

  <!-- steps -->
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px 4px">
    <span style="font-size:12px;font-weight:800;color:#6FA678">Trộn</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    <span style="font-size:13px;font-weight:800;color:#B5651D;background:#fff;border-radius:8px;padding:3px 10px;box-shadow:0 2px 0 #E0C79B">Nướng</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    <span style="font-size:12px;font-weight:800;color:#A08A6E">Trang trí</span>
  </div>

  <!-- oven / cake -->
  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px">
    <div style="width:180px;height:180px;border-radius:32px;background:#C9722E;box-shadow:0 8px 0 #9C5A1E;display:flex;align-items:center;justify-content:center">
      <div style="width:130px;height:120px;border-radius:18px;background:#6B3A16;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px">
        <div style="width:70px;height:52px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
    <div style="text-align:center">
      <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;color:#7A3E12">Canh lò!</div>
      <div style="font-size:13px;color:#8A6A54;margin-top:2px">Chạm khi kim chạy vào vùng vàng</div>
    </div>

    <!-- timing gauge -->
    <div style="width:100%;height:26px;border-radius:999px;background:#EBC98E;box-shadow:inset 0 2px 4px rgba(120,70,20,.25);position:relative;overflow:hidden">
      <div style="position:absolute;left:46%;top:0;bottom:0;width:22%;background:#F4C542"></div>
      <div style="position:absolute;left:57%;top:-6px;bottom:-6px;width:5px;border-radius:3px;background:#7A3E12"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:13px;font-weight:800;color:#6B4A32">Chất lượng</span>
      <span style="color:#E7B23C;font-size:18px;letter-spacing:2px">★★★★<span style="color:#D9C3A0">★</span></span>
    </div>
  </div>

  <!-- action -->
  <div style="padding:12px 24px 34px">
    <a href="Home.dc.html">
      <div style="height:62px;border-radius:20px;background:{{accent}};box-shadow:0 5px 0 #7A3E12;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;font-family:'Fredoka',sans-serif;letter-spacing:1px">CHẠM!</div>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
