<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tiệm bánh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EAD9BE;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <!-- HUD -->
  <div style="padding:44px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px">
    <div style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border-radius:16px;padding:6px 12px 6px 6px;box-shadow:0 3px 0 #D9C3A0">
      <div style="width:40px;height:40px;border-radius:50%;background:#FFE0C4;border:2px solid #D98A3D"></div>
      <div>
        <div style="font-weight:800;font-size:13px;color:#4A2B1A">Tiệm Bánh Nắng</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <span style="font-size:10px;font-weight:800;color:#7A3E12;background:#F3D9AE;border-radius:6px;padding:1px 5px">Lv.7</span>
          <span style="width:52px;height:6px;border-radius:3px;background:#E7C089;overflow:hidden"><span style="display:block;width:60%;height:100%;background:#6FA678"></span></span>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px 5px 6px;box-shadow:0 3px 0 #D9C3A0">
        <span style="width:20px;height:20px;border-radius:50%;background:#E7B23C;border:2px solid #C9922A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#7A5514">₵</span>
        <span style="font-weight:800;font-size:13px">2.480</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 12px 5px 8px;box-shadow:0 3px 0 #D9C3A0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#7C6BD6" stroke="#5B4BB0" stroke-width="1.5"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        <span style="font-weight:800;font-size:13px">64</span>
      </div>
    </div>
  </div>

  <!-- Shop scene -->
  <div style="flex-grow:1;margin:6px 16px 0;background:#F6E7CC;border-radius:22px;box-shadow:inset 0 3px 8px rgba(120,70,20,.12);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end">

    <div style="position:absolute;top:16px;left:16px;background:#E28B9B;color:#fff;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;box-shadow:0 3px 0 #C64C63">3 khách đang chờ</div>
    <div style="position:absolute;top:16px;right:16px;background:#fff;border-radius:12px;padding:6px 10px;text-align:center;box-shadow:0 3px 0 #D9C3A0">
      <div style="font-size:10px;color:#8A6A54;font-weight:700">Doanh thu hôm nay</div>
      <div style="font-size:14px;font-weight:800;color:#3E7A4A">+ 640 ₵</div>
    </div>

    <!-- customers -->
    <div style="display:flex;gap:14px;justify-content:center;margin-bottom:12px">
      <svg width="40" height="52" viewBox="0 0 40 52" aria-hidden="true"><circle cx="20" cy="14" r="10" fill="#F6C99B"/><path d="M6 52c0-10 6-18 14-18s14 8 14 18z" fill="#8FB6E0"/></svg>
      <svg width="40" height="52" viewBox="0 0 40 52" aria-hidden="true"><circle cx="20" cy="14" r="10" fill="#E7C6A6"/><path d="M6 52c0-10 6-18 14-18s14 8 14 18z" fill="#E0A9B4"/></svg>
      <svg width="40" height="52" viewBox="0 0 40 52" aria-hidden="true"><circle cx="20" cy="14" r="10" fill="#F6C99B"/><path d="M6 52c0-10 6-18 14-18s14 8 14 18z" fill="#A8CDA0"/></svg>
    </div>

    <!-- display counter -->
    <div style="background:#C9722E;border-radius:0 0 22px 22px;padding:12px 14px 18px">
      <div style="display:flex;gap:10px">
        <div style="flex:1;height:70px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="font-size:10px;font-weight:700;color:#A5763F">Bánh 1</span>
        </div>
        <div style="flex:1;height:70px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20" stroke-linecap="round"/></svg>
          <span style="font-size:10px;font-weight:700;color:#A5763F">Bánh 2</span>
        </div>
        <div style="flex:1;height:70px;border-radius:12px;background:#FFF6E9;border:2px dashed #D9B98A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B98F55" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          <span style="font-size:10px;font-weight:700;color:#A5763F">Trống</span>
        </div>
      </div>
    </div>
  </div>

  <!-- primary action -->
  <div style="padding:12px 16px 6px">
    <a href="Kitchen.dc.html">
      <div style="height:54px;border-radius:16px;background:{{accent}};box-shadow:0 4px 0 #7A3E12;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;font-family:'Fredoka',sans-serif">Vào bếp làm bánh</div>
    </a>
  </div>

  <!-- bottom nav -->
  <div style="display:flex;justify-content:space-around;align-items:center;padding:8px 8px 22px;background:#FFFFFF;box-shadow:0 -3px 0 #E4CFA8">
    <a href="Home.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#B5651D;font-weight:800;font-size:11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B5651D" stroke-width="2"><path d="M3 11 12 3l9 8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Tiệm
    </a>
    <a href="Kitchen.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A08A6E;font-weight:700;font-size:11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A08A6E" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16" stroke-linecap="round"/><circle cx="8" cy="7" r="1"/><circle cx="12" cy="7" r="1"/></svg>
      Bếp
    </a>
    <a href="Market.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A08A6E;font-weight:700;font-size:11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A08A6E" stroke-width="2"><path d="M4 4h2l2 12h10l2-8H7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      Chợ
    </a>
    <a href="Leaderboard.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A08A6E;font-weight:700;font-size:11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A08A6E" stroke-width="2"><path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M9 15h6M8 20h8M12 14v6" stroke-linecap="round"/></svg>
      BXH
    </a>
    <a href="Store.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#A08A6E;font-weight:700;font-size:11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A08A6E" stroke-width="2"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0" stroke-linecap="round"/></svg>
      Cửa hàng
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#b5651d' }; }
}
</script>
</body>
</html>
