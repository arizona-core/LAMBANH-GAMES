<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sự kiện: Lạm phát</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:'Nunito',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EAD9BE;font-family:'Nunito',sans-serif;color:#4A2B1A;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="position:absolute;inset:0;background:#3A2412;opacity:.55"></div>

  <div style="position:relative;width:100%;background:#fff;border-radius:26px;box-shadow:0 12px 0 rgba(0,0,0,.18);padding:26px 22px;text-align:center">
    <div style="width:88px;height:88px;border-radius:50%;background:#FCE7C4;margin:0 auto 16px;display:flex;align-items:center;justify-content:center">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#C97A1E" stroke-width="2.2"><path d="M4 17l6-6 4 4 6-7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8h5v5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font-size:11px;font-weight:800;color:#C97A1E;letter-spacing:1px">SỰ KIỆN KINH TẾ</div>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:#7A3E12;margin-top:4px">Lạm phát!</div>
    <p style="font-size:14px;color:#6B4A32;line-height:1.55;margin:12px 6px 18px">Giá nguyên liệu toàn server tăng <b>15%</b> trong tuần này. Cân nhắc tích trữ sớm hoặc tăng nhẹ giá bán để giữ lợi nhuận.</p>

    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px">
      <div style="background:#FCE7C4;border-radius:12px;padding:10px 14px;flex:1"><div style="font-size:11px;color:#8A6A54;font-weight:700">Nguyên liệu</div><div style="font-weight:800;color:#C97A1E;font-size:16px">▲ 15%</div></div>
      <div style="background:#E3F0DC;border-radius:12px;padding:10px 14px;flex:1"><div style="font-size:11px;color:#8A6A54;font-weight:700">Giá bán gợi ý</div><div style="font-weight:800;color:#3E7A4A;font-size:16px">▲ 8%</div></div>
    </div>

    <div style="display:flex;gap:10px">
      <button style="flex:1;height:50px;border:2px solid #D9C3A0;background:#fff;border-radius:14px;color:#8A6A54;font-weight:800;font-size:14px;cursor:pointer">Để sau</button>
      <a href="Market.dc.html" style="flex:1">
        <div style="height:50px;border-radius:14px;background:{{accent}};box-shadow:0 4px 0 #7A3E12;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px">Đi tích trữ</div>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return { accent: this.props.accent ?? '#b5651d' }; } }
</script>
</body>
</html>
