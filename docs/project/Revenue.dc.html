<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Doanh thu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBEFDD;font-family:'Nunito',sans-serif;color:#4A2B1A;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:44px 16px 8px;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Quay lại" style="width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A3E12" stroke-width="2.4"><path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:#7A3E12">Doanh thu</div>
  </div>

  <!-- period tabs -->
  <div style="display:flex;gap:8px;padding:6px 16px 12px">
    <div style="flex:1;text-align:center;padding:8px 0;border-radius:12px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:13px">Hôm nay</div>
    <div style="flex:1;text-align:center;padding:8px 0;border-radius:12px;background:{{accent}};color:#fff;font-weight:800;font-size:13px">Tuần này</div>
    <div style="flex:1;text-align:center;padding:8px 0;border-radius:12px;background:#F2E1C4;color:#8A6A54;font-weight:800;font-size:13px">Tháng</div>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:14px">

    <!-- total -->
    <div style="background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 0 #EADFC8">
      <div style="font-size:12px;color:#8A6A54;font-weight:700">Lợi nhuận ròng tuần</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:2px">
        <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;color:#3E7A4A">+ 8.640 ₵</span>
        <span style="font-size:12px;font-weight:800;color:#3E7A4A;background:#E3F0DC;border-radius:8px;padding:2px 7px">▲ 12%</span>
      </div>

      <!-- bar chart -->
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:110px;margin-top:16px">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:52%;background:#EDD3A6;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#8A6A54">T2</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:66%;background:#EDD3A6;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#8A6A54">T3</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:45%;background:#EDD3A6;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#8A6A54">T4</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:78%;background:#EDD3A6;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#8A6A54">T5</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:90%;background:#D98A3D;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#7A3E12;font-weight:800">T6</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:100%;background:#D98A3D;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#7A3E12;font-weight:800">T7</span></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end"><span style="width:100%;height:60%;background:#EDD3A6;border-radius:6px 6px 0 0"></span><span style="font-size:10px;color:#8A6A54">CN</span></div>
      </div>
    </div>

    <!-- breakdown -->
    <div style="background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 #EADFC8">
      <div style="font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:10px">Nguồn thu</div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Bán tại quán</span><span style="font-weight:800;color:#3E7A4A">+ 6.200 ₵</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Đơn khách đặt</span><span style="font-weight:800;color:#3E7A4A">+ 3.400 ₵</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Bán ở chợ</span><span style="font-weight:800;color:#3E7A4A">+ 1.900 ₵</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Tiền tip</span><span style="font-weight:800;color:#3E7A4A">+ 340 ₵</span></div>
      <div style="height:1px;background:#F1E6D2;margin:6px 0"></div>
      <div style="font-weight:800;font-size:13px;color:#6B4A32;margin-bottom:6px">Chi phí</div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Phí mặt bằng &amp; điện</span><span style="font-weight:800;color:#C0453F">− 1.800 ₵</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Nguyên liệu</span><span style="font-weight:800;color:#C0453F">− 1.100 ₵</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span style="color:#6B4A32;font-weight:700">Bị phạt vệ sinh</span><span style="font-weight:800;color:#C0453F">− 500 ₵</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b5651d"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return { accent: this.props.accent ?? '#b5651d' }; } }
</script>
</body>
</html>
