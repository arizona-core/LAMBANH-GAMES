    <div style="width:74px;height:74px;border-radius:50%;background:#D6E4F5;border:3px solid #fff;box-shadow:0 0 0 3px #A9C4E0;margin:14px auto 8px;display:flex;align-items:center;justify-content:center">

    <div style="font-weight:800;font-size:16px">Chú Ba <span style="font-size:10px;background:#EFE3FB;color:#5B4BB0;border-radius:6px;padding:2px 7px;vertical-align:middle">Khách AI</span></div>

    <div style="display:flex;gap:10px;justify-content:center;margin:16px 0 18px">
      <div style="background:#E3F0DC;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;color:#3E7A4A">+ 12 uy tín</div>

    <p style="font-size:11px;color:#A5763F;line-height:1.5;margin:0 4px 16px">Khách AI tự ghé quán và chấm điểm dựa trên <b>chất lượng bánh, độ tươi, giá và tốc độ phục vụ</b>.</p>

    <div style="display:flex;gap:10px">
